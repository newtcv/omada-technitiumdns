services:
  omada-technitium:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - ./config.json:/app/config.json:ro
      - sync-state:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sync-state:
